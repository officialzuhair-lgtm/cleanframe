<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CleanFrame</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Everything is drawn on a fixed 1920x1080 stage, scaled to fit the TV's browser. -->
  <div id="stage" class="layout-classic">
    <div class="bg" id="bg-a"></div>
    <div class="bg" id="bg-b"></div>
    <div class="shade"></div>

    <div id="ui">
      <header class="top">
        <div class="timebox">
          <div class="greeting" id="greeting"></div>
          <div class="clock" id="clock">--:--</div>
          <div class="date" id="date"></div>
        </div>
        <div class="weather" id="weather">
          <div class="w-temp" id="w-temp"></div>
          <div class="w-text" id="w-text"></div>
          <div class="w-range" id="w-range"></div>
        </div>
      </header>

      <nav class="tiles" id="tiles"></nav>

      <footer class="hints">
        <span><b>OK</b> open</span>
        <span><i class="dot blue"></i> settings</span>
        <span><i class="dot yellow"></i> frame mode</span>
      </footer>
    </div>

    <div id="frame-clock"></div>

    <aside id="settings" aria-hidden="true">
      <h2>Settings</h2>
      <ul id="settings-list"></ul>
      <p class="settings-hint">◀ ▶ change &nbsp;·&nbsp; BACK close</p>
    </aside>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
